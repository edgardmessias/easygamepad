name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (vX.Y.Z)'
        required: true
        type: string
      run_instrumentation:
        description: 'Run Compose UI instrumentation during CI checks'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      resolved_sha: ${{ steps.resolve.outputs.resolved_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag and pinned commit
        id: resolve
        env:
          DISPATCH_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == tag ]]; then
            release_tag="${{ github.ref_name }}"
          else
            if [[ -z "$DISPATCH_TAG" ]]; then
              echo "::error::Workflow dispatch requires an existing vX.Y.Z tag."
              exit 1
            fi
            if [[ "${{ github.ref }}" != refs/heads/main ]]; then
              echo "::error::Run Release manually only from the main branch."
              exit 1
            fi
            release_tag="$DISPATCH_TAG"
          fi
          python3 -B .github/scripts/release.py resolve-tag "$release_tag"
          resolved_sha="$(git rev-parse --verify "refs/tags/${release_tag}^{commit}")"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "resolved_sha=${resolved_sha}" >> "$GITHUB_OUTPUT"

      - name: Check out tagged release commit
        run: git checkout --force "${{ steps.resolve.outputs.resolved_sha }}"

      - name: Validate release tag metadata
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: python3 -B .github/scripts/release.py validate-tag "$RELEASE_TAG"

  checks:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.validate-tag.outputs.resolved_sha }}
      run_instrumentation: ${{ github.event_name == 'workflow_dispatch' && inputs.run_instrumentation || false }}
    permissions:
      contents: read

  build:
    needs: [validate-tag, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.validate-tag.outputs.release_tag }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate-tag.outputs.resolved_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: true

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/easygamepad-release.jks
        run: python3 -B .github/scripts/release.py restore-keystore

      - name: Assemble signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/easygamepad-release.jks
        run: bash ./gradlew :app:assembleRelease --no-daemon --no-build-cache --no-configuration-cache

      - name: Verify and package release assets
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          python3 -B .github/scripts/release.py package "$RELEASE_TAG"

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing key
        if: ${{ always() }}
        run: rm -f -- "${{ runner.temp }}/easygamepad-release.jks"

  publish:
    needs: [validate-tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate-tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate-tag.outputs.resolved_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist

      - name: Generate release notes (git-cliff)
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/release-notes.md"
          python3 -B .github/scripts/release.py prepare-notes "$RELEASE_TAG" > "$notes_file"
          if [[ ! -s "$notes_file" ]]; then
            echo "::error::Release notes are empty for $RELEASE_TAG."
            exit 1
          fi

      - name: Create draft, attach assets and publish
        env:
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json url --jq .url >/dev/null; then
            echo "::error::A release already exists for $RELEASE_TAG. Published releases are never overwritten. If a previous attempt left a draft, delete only that draft (keep the tag) before retrying."
            exit 1
          fi
          notes_file="${RELEASE_NOTES_FILE}"
          if [[ ! -s "$notes_file" ]]; then
            echo "::error::Release notes file is missing or empty."
            exit 1
          fi
          shopt -s nullglob
          assets=(dist/*)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "::error::No release assets found in dist/."
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --draft \
            --title "EasyGamepad ${RELEASE_TAG#v}" \
            --notes-file "$notes_file"
          gh release edit "$RELEASE_TAG" --draft=false
